[project]
name = "agent-kit"
version = "0.1.0"
description = "Shared Deep Agents plumbing for the Doctor, Librarian and Mechanic: the git-scoped codebase mount, Gemini model wiring, turn recording"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.28",
    "langchain-google-genai>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
