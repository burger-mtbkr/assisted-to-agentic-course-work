[project]
name = "librarian-agent"
version = "0.1.0"
description = "The Librarian: a read-only memory, knowledge and retrieval agent for config-service (Module 8)"
requires-python = ">=3.13"
dependencies = [
    "agent-kit",
    "deepagents>=0.7.28",
    "langchain-google-genai>=4.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
librarian = "librarian_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14",
]

[tool.uv.sources]
agent-kit = { path = "../agent-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]  # not tested_in_edges
markers = ["live: calls the Gemini embedding API; run with LIBRARIAN_LIVE=1"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
