[project]
name = "agent-hub"
version = "0.1.0"
description = "One browser UI over every agent in this repo: the PAIR Agent, the Doctor, the Librarian and the Codebase Team"
requires-python = ">=3.13"
dependencies = [
    "agent-kit",
    "codebase-team",
    "doctor-agent",
    "langchain-core>=1.0",
    "librarian-agent",
    "pair-agent",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "starlette>=1.8",
    "uvicorn>=0.54",
]

[project.scripts]
agent-hub = "agent_hub.server:main"

[tool.uv.sources]
agent-kit = { path = "../agent-kit", editable = true }
codebase-team = { path = "../codebase-team", editable = true }
doctor-agent = { path = "../doctor-agent", editable = true }
librarian-agent = { path = "../librarian-agent", editable = true }
pair-agent = { path = "../pair-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.ruff]
line-length = 110
target-version = "py313"
